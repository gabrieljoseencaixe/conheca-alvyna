<style>:root{color-scheme:dark;--n:#0B1F3B;--d:#071428;--g:#D4AF7C;--gl:#E8CFA4;--t:#E9EDF5;--m:#AEB8CA}*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(80% 360px at 50% 0,#17355F,var(--d) 70%);color:var(--t);font:16px/1.55 Jost,system-ui,sans-serif;padding:env(safe-area-inset-top) 0 calc(28px + env(safe-area-inset-bottom))}
main{max-width:560px;margin:0 auto;padding:0 18px}header{text-align:center;padding:26px 0 10px}header img{width:120px}h1,h2{font-family:'Cormorant Garamond',serif;font-weight:500;margin:0}
h1{font-size:34px;line-height:1.1;margin-top:8px}.sub{color:var(--m);margin:6px 0 0}h2{font-size:26px;color:var(--gl);margin-bottom:12px}
section{margin-top:26px;padding-top:20px;border-top:1px solid rgba(212,175,124,.35)}.opt{display:flex;justify-content:space-between;gap:12px;width:100%;text-align:left;background:rgba(255,255,255,.05);border:1px solid rgba(212,175,124,.4);border-radius:14px;color:var(--t);padding:14px 16px;margin-bottom:8px;font:inherit;cursor:pointer;min-height:52px}
.opt.on{background:var(--g);color:var(--n);border-color:var(--g)}.opt small{opacity:.85;white-space:nowrap}.days{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}.day{flex:0 0 auto;min-width:64px;text-align:center;background:rgba(255,255,255,.05);border:1px solid rgba(212,175,124,.4);border-radius:14px;color:var(--t);padding:10px 8px;font:inherit;cursor:pointer}
.day b{display:block;font-weight:500;font-size:19px}.day.on{background:var(--g);color:var(--n)}.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.slot{padding:12px 0;border-radius:12px;border:1px solid rgba(212,175,124,.4);background:rgba(255,255,255,.05);color:var(--t);font:inherit;cursor:pointer}.slot.on{background:var(--g);color:var(--n)}
label{display:block;margin-bottom:12px;color:var(--m);font-size:14px}input{display:block;width:100%;margin-top:4px;padding:13px 14px;border-radius:12px;border:1px solid rgba(212,175,124,.45);background:rgba(7,20,40,.7);color:var(--t);font:inherit}
.go{display:block;width:100%;margin-top:10px;padding:15px;border:0;border-radius:999px;background:linear-gradient(120deg,#A5804B,#D4AF7C 40%,#F3E2BF 55%,#D4AF7C 75%,#A5804B);color:#071428;font:500 15px Jost,sans-serif;letter-spacing:2px;cursor:pointer}.go[disabled]{opacity:.5}
